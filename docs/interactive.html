<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Point Cloud Blob — Interactive</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

      :root {
        --bg:        #050505;
        --text:      #eef4ff;
        --muted:     #8899b8;
        --accent:    #7dd9ff;
        --accent2:   #e666ff;
        --panel-bg:  rgba(10, 12, 22, 0.72);
        --panel-brd: rgba(255,255,255,0.09);
        --radius:    14px;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: var(--bg);
        font-family: 'Inter', sans-serif;
        color: var(--text);
        overflow: hidden;
        height: 100dvh;
      }

      canvas { display: block; position: fixed; inset: 0; }

      /* ── Top bar ── */
      #topbar {
        position: fixed;
        top: 0; left: 0; right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 24px;
        z-index: 20;
        pointer-events: none;
      }
      #title-block { pointer-events: none; }
      #title-block h1 { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.02em; }
      #title-block p  { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

      .back-btn {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        background: var(--panel-bg);
        backdrop-filter: blur(12px);
        color: var(--text);
        text-decoration: none;
        border-radius: 8px;
        border: 1px solid var(--panel-brd);
        font-size: 0.82rem;
        transition: background 0.2s;
      }
      .back-btn:hover { background: rgba(255,255,255,0.12); }

      /* ── Control Panel ── */
      #panel {
        position: fixed;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        width: 240px;
        background: var(--panel-bg);
        backdrop-filter: blur(20px) saturate(1.4);
        border: 1px solid var(--panel-brd);
        border-radius: var(--radius);
        padding: 18px 16px 14px;
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .section-title {
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.10em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 2px;
      }

      /* sliders */
      .ctrl-row {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .ctrl-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.78rem;
        color: var(--muted);
      }
      .ctrl-label span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }

      input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        height: 4px;
        border-radius: 2px;
        background: rgba(255,255,255,0.12);
        outline: none;
        cursor: pointer;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px; height: 14px;
        border-radius: 50%;
        background: var(--accent);
        border: 2px solid #050505;
        transition: transform 0.15s;
      }
      input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.25); }

      /* color pickers */
      .color-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .color-swatch {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
      }
      .color-swatch label { font-size: 0.72rem; color: var(--muted); }
      input[type=color] {
        -webkit-appearance: none;
        width: 100%;
        height: 30px;
        border: 1px solid var(--panel-brd);
        border-radius: 6px;
        cursor: pointer;
        background: none;
        padding: 2px;
      }
      input[type=color]::-webkit-color-swatch-wrapper { padding: 0; border-radius: 4px; }
      input[type=color]::-webkit-color-swatch { border: none; border-radius: 4px; }

      /* divider */
      .divider { height: 1px; background: var(--panel-brd); margin: 0 -2px; }

      /* buttons row */
      .btn-row { display: flex; gap: 8px; }
      .btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 8px 6px;
        border-radius: 8px;
        border: 1px solid var(--panel-brd);
        background: rgba(255,255,255,0.06);
        color: var(--text);
        font-size: 0.78rem;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        font-family: inherit;
      }
      .btn:hover { background: rgba(255,255,255,0.14); }
      .btn.active { border-color: var(--accent); color: var(--accent); background: rgba(125,217,255,0.1); }
      .btn.accent  { border-color: var(--accent2); color: var(--accent2); background: rgba(230,102,255,0.1); }
      .btn.accent:hover { background: rgba(230,102,255,0.18); }

      /* ── Audio player strip ── */
      #audio-strip {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: min(520px, calc(100vw - 40px));
        background: var(--panel-bg);
        backdrop-filter: blur(20px) saturate(1.4);
        border: 1px solid var(--panel-brd);
        border-radius: var(--radius);
        padding: 12px 18px;
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      #track-info {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #visualiser {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 24px;
        flex-shrink: 0;
      }
      .vis-bar {
        width: 3px;
        min-height: 2px;
        border-radius: 2px;
        background: var(--accent);
        transition: height 0.05s;
      }

      #track-name {
        font-size: 0.82rem;
        font-weight: 500;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #track-time { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }

      #progress-bar {
        -webkit-appearance: none;
        width: 100%;
        height: 3px;
        border-radius: 2px;
        background: rgba(255,255,255,0.12);
        outline: none;
        cursor: pointer;
        accent-color: var(--accent);
      }

      #audio-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
      }

      .audio-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px; height: 34px;
        border-radius: 50%;
        border: 1px solid var(--panel-brd);
        background: rgba(255,255,255,0.06);
        color: var(--text);
        cursor: pointer;
        font-size: 0.9rem;
        transition: background 0.15s;
        user-select: none;
      }
      .audio-btn.big {
        width: 42px; height: 42px;
        font-size: 1.1rem;
        border-color: var(--accent);
        color: var(--accent);
        background: rgba(125,217,255,0.1);
      }
      .audio-btn:hover { background: rgba(255,255,255,0.18); }
      .audio-btn.big:hover { background: rgba(125,217,255,0.2); }

      #volume-row { display: flex; align-items: center; gap: 8px; }
      #volume-row span { font-size: 0.8rem; color: var(--muted); flex-shrink:0; }
      #volume-slider { flex: 1; }

      /* start overlay */
      #start-overlay {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: rgba(5,5,5,0.85);
        backdrop-filter: blur(8px);
        z-index: 100;
        gap: 16px;
      }
      #start-overlay h2 { font-size: 1.8rem; font-weight: 600; }
      #start-overlay p  { color: var(--muted); font-size: 0.9rem; }
      #start-btn {
        margin-top: 8px;
        padding: 12px 32px;
        border-radius: 50px;
        border: 1px solid var(--accent);
        background: rgba(125,217,255,0.12);
        color: var(--accent);
        font-size: 1rem;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.2s, transform 0.15s;
      }
      #start-btn:hover { background: rgba(125,217,255,0.22); transform: scale(1.04); }
    </style>
  </head>
  <body>

    <!-- Start overlay (needed for Web Audio autoplay policy) -->
    <div id="start-overlay">
      <h2>Point Cloud Blob</h2>
      <p>Interactive WebGL + Audio Experience</p>
      <button id="start-btn">▶ &nbsp; Start Experience</button>
    </div>

    <!-- Top bar -->
    <div id="topbar">
      <div id="title-block">
        <h1>Point Cloud Blob</h1>
        <p>Interactive 3D · WebGL</p>
      </div>
      <a href="index.html" class="back-btn">← Animation</a>
    </div>

    <!-- Control Panel -->
    <div id="panel">

      <div>
        <div class="section-title">Animation</div>
        <div class="btn-row">
          <button class="btn active" id="btn-play">⏸ Pause</button>
          <button class="btn" id="btn-react">♪ Sync</button>
        </div>
      </div>

      <div class="divider"></div>

      <div>
        <div class="section-title">Colors</div>
        <div class="color-row">
          <div class="color-swatch">
            <label>Color A</label>
            <input type="color" id="color1" value="#e666ff" />
          </div>
          <div class="color-swatch">
            <label>Color B</label>
            <input type="color" id="color2" value="#38bdff" />
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div>
        <div class="section-title">Shape</div>
        <div class="ctrl-row">
          <div class="ctrl-label"><span>Noise Scale</span><span id="lbl-noise">1.0</span></div>
          <input type="range" id="noise-scale" min="0.2" max="4.0" step="0.1" value="1.0" />
        </div>
        <div class="ctrl-row" style="margin-top:8px">
          <div class="ctrl-label"><span>Speed</span><span id="lbl-speed">1.0</span></div>
          <input type="range" id="anim-speed" min="0.0" max="3.0" step="0.05" value="1.0" />
        </div>
        <div class="ctrl-row" style="margin-top:8px">
          <div class="ctrl-label"><span>Point Size</span><span id="lbl-pts">9</span></div>
          <input type="range" id="point-size" min="2" max="30" step="1" value="9" />
        </div>
      </div>

      <div class="divider"></div>

      <div>
        <div class="section-title">Bloom</div>
        <div class="ctrl-row">
          <div class="ctrl-label"><span>Intensity</span><span id="lbl-bloom">0.6</span></div>
          <input type="range" id="bloom-int" min="0" max="3.0" step="0.05" value="0.6" />
        </div>
        <div class="ctrl-row" style="margin-top:8px">
          <div class="ctrl-label"><span>Radius</span><span id="lbl-bloom-r">0.6</span></div>
          <input type="range" id="bloom-rad" min="0" max="2.0" step="0.05" value="0.6" />
        </div>
      </div>

      <div class="divider"></div>

      <div class="btn-row">
        <button class="btn accent" id="btn-screenshot">📷 Save</button>
      </div>

    </div>

    <!-- Audio strip -->
    <div id="audio-strip">
      <div id="track-info">
        <div id="visualiser">
          <!-- bars injected by JS -->
        </div>
        <div id="track-name">Loading…</div>
        <div id="track-time">0:00 / 0:00</div>
      </div>
      <input type="range" id="progress-bar" min="0" max="1" step="0.001" value="0" />
      <div id="audio-controls">
        <div class="audio-btn" id="btn-prev" title="Previous">⏮</div>
        <div class="audio-btn big" id="btn-playpause" title="Play / Pause">⏸</div>
        <div class="audio-btn" id="btn-next" title="Next">⏭</div>
        <div id="volume-row" style="flex:1; display:flex; align-items:center; gap:8px; margin-left:8px;">
          <span>🔊</span>
          <input type="range" id="volume-slider" class="ctrl-row" min="0" max="1" step="0.01" value="0.8" style="height:4px;flex:1;" />
        </div>
      </div>
    </div>

    <!-- Three.js modules -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
      import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
      import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
      import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

      // ═══════════════════════════════════════
      //  SHADERS
      // ═══════════════════════════════════════
      const vertexShader = /* glsl */`
        uniform float uTime;
        uniform float uNoiseScale;
        uniform float uSpeed;
        uniform float uAudioBass;
        uniform float uPointSize;

        varying float vNormZ;
        varying float vRand;

        float hash(float n) { return fract(sin(n) * 43758.5453123); }

        float noise3(vec3 p) {
          vec3 i = floor(p);
          vec3 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          float n = i.x + i.y * 57.0 + i.z * 113.0;
          return mix(
            mix(mix(hash(n+0.),hash(n+1.),f.x), mix(hash(n+57.),hash(n+58.),f.x), f.y),
            mix(mix(hash(n+113.),hash(n+114.),f.x), mix(hash(n+170.),hash(n+171.),f.x), f.y),
            f.z
          );
        }

        float fbm(vec3 p) {
          float v = 0.0, a = 0.5;
          for (int i = 0; i < 5; i++) { v += a * noise3(p); p *= 2.0; a *= 0.5; }
          return v;
        }

        void main() {
          vec3 pos = position;
          float t = uTime * 0.35 * uSpeed;
          float audioBoost = 1.0 + uAudioBass * 0.35;

          float ns = uNoiseScale * audioBoost;
          float noiseA = fbm(pos * 1.45 * ns + vec3(0.0, 0.0, t * 1.4));
          float noiseB = fbm(pos * 3.20 * ns + vec3(0.0, 0.0, 3.8 + t * 2.2));

          float combined = noiseA * 0.34 + noiseB * 0.13;
          float angle  = t;
          float ampMin = (-0.16 - 0.02 * sin(angle)) * audioBoost;
          float ampMax = ( 0.29 + 0.035 * cos(angle)) * audioBoost;

          float disp = ampMin + combined / 0.52 * (ampMax - ampMin);
          pos += normal * disp;

          pos.x *= 1.12 + 0.03 * sin(angle) + uAudioBass * 0.05;
          pos.y *= 0.98 + 0.02 * cos(angle * 2.0);
          pos.z *= 1.06 + 0.025 * cos(angle);

          float rotZ = 0.418 + 0.244 * sin(angle);
          float cZ = cos(rotZ); float sZ = sin(rotZ);
          pos = vec3(cZ*pos.x - sZ*pos.y, sZ*pos.x + cZ*pos.y, pos.z);

          float rotX = 0.279 + 0.087 * cos(angle);
          float cX = cos(rotX); float sX = sin(rotX);
          pos = vec3(pos.x, cX*pos.y - sX*pos.z, sX*pos.y + cX*pos.z);

          vNormZ = clamp((pos.z + 1.5) / 3.0, 0.0, 1.0);
          vRand  = hash(position.x * 17.3 + position.y * 41.7 + position.z * 93.1);

          vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
          gl_Position  = projectionMatrix * mvPos;
          gl_PointSize = uPointSize / -mvPos.z;
        }
      `;

      const fragmentShader = /* glsl */`
        uniform vec3 uColor1;
        uniform vec3 uColor2;
        varying float vNormZ;
        varying float vRand;

        void main() {
          vec2 c = gl_PointCoord - 0.5;
          float d = length(c);
          if (d > 0.5) discard;
          float alpha = 1.0 - smoothstep(0.3, 0.5, d);

          float t = smoothstep(0.08, 0.92, vNormZ);
          t = clamp(t + (vRand - 0.5) * 0.07, 0.0, 1.0);
          vec3 color = mix(uColor1, uColor2, t);

          gl_FragColor = vec4(color * 0.95, alpha * 0.88);
        }
      `;

      // ═══════════════════════════════════════
      //  HELPERS
      // ═══════════════════════════════════════
      function hexToVec3(hex) {
        const r = parseInt(hex.slice(1,3),16)/255;
        const g = parseInt(hex.slice(3,5),16)/255;
        const b = parseInt(hex.slice(5,7),16)/255;
        return new THREE.Color(r, g, b);
      }

      function fmt(sec) {
        const s = Math.floor(sec); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
      }

      // ═══════════════════════════════════════
      //  THREE.JS SCENE
      // ═══════════════════════════════════════
      const W = window.innerWidth, H = window.innerHeight;
      const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(W, H);
      document.body.insertBefore(renderer.domElement, document.body.firstChild);

      const scene  = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(68, W/H, 0.1, 100);
      camera.position.set(0, -6.8, 0.7);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0.06);
      controls.enableDamping = true; controls.dampingFactor = 0.06;
      controls.minDistance = 3; controls.maxDistance = 20;

      const uniforms = {
        uTime:      { value: 0 },
        uNoiseScale:{ value: 1.0 },
        uSpeed:     { value: 1.0 },
        uAudioBass: { value: 0.0 },
        uPointSize: { value: 9.0 },
        uColor1:    { value: hexToVec3('#e666ff') },
        uColor2:    { value: hexToVec3('#38bdff') },
      };

      const geo = new THREE.SphereGeometry(1.15, 160, 112);
      const mat = new THREE.ShaderMaterial({
        vertexShader, fragmentShader, uniforms,
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
      });
      scene.add(new THREE.Points(geo, mat));

      // Bloom
      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      const bloomPass = new UnrealBloomPass(new THREE.Vector2(W, H), 0.6, 0.6, 0.1);
      composer.addPass(bloomPass);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      });

      // ═══════════════════════════════════════
      //  AUDIO ENGINE
      // ═══════════════════════════════════════
      const TRACKS = [
        { src: './assets/audio/Digital_Bloom_1.mp3', name: 'Digital Bloom 1' },
        { src: './assets/audio/Digital_Bloom_2.mp3', name: 'Digital Bloom 2' },
      ];

      const FADE_TIME = 2.5; // seconds crossfade

      let audioCtx, analyser, gainA, gainB;
      let sourceA = null, sourceB = null;
      let buffers = [];
      let currentTrack = 0;
      let trackOffset = 0;     // seconds into current track
      let playStartAt = 0;     // audioCtx.currentTime when track started
      let isPlaying   = false;
      let audioReady  = false;
      let audioReact  = false;

      async function initAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser  = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        gainA = audioCtx.createGain();
        gainB = audioCtx.createGain();
        gainA.connect(analyser);
        gainB.connect(analyser);
        analyser.connect(audioCtx.destination);

        // Load buffers
        buffers = await Promise.all(TRACKS.map(async t => {
          const res = await fetch(t.src);
          const arr = await res.arrayBuffer();
          return audioCtx.decodeAudioData(arr);
        }));
        audioReady = true;
        updateTrackName();
      }

      function updateVolume(v) {
        if (!audioCtx) return;
        // Only update the active gain
        const activeGain = (currentTrack % 2 === 0) ? gainA : gainB;
        activeGain.gain.setTargetAtTime(v, audioCtx.currentTime, 0.05);
      }

      let volValue = 0.8;

      function playTrack(index, offset = 0) {
        if (!audioReady || !buffers.length) return;
        const vol = volValue;

        // Determine which gain node takes [new] and which fades [old]
        const isEven = (index % 2 === 0);
        const freshGain = isEven ? gainA : gainB;
        const oldGain   = isEven ? gainB : gainA;
        const freshSrc  = audioCtx.createBufferSource();
        freshSrc.buffer = buffers[index];
        freshSrc.connect(freshGain);

        // Crossfade
        const now = audioCtx.currentTime;
        freshGain.gain.setValueAtTime(0, now);
        freshGain.gain.linearRampToValueAtTime(vol, now + FADE_TIME);
        oldGain.gain.setValueAtTime(vol, now);
        oldGain.gain.linearRampToValueAtTime(0, now + FADE_TIME);

        // Stop old source after fade
        if (isEven && sourceB) { try { sourceB.stop(now + FADE_TIME + 0.1); } catch(e){} }
        if (!isEven && sourceA) { try { sourceA.stop(now + FADE_TIME + 0.1); } catch(e){} }

        freshSrc.start(now, offset);
        freshSrc.onended = () => {
          if (isPlaying) nextTrack();
        };

        if (isEven) sourceA = freshSrc; else sourceB = freshSrc;

        currentTrack = index;
        trackOffset  = offset;
        playStartAt  = audioCtx.currentTime - offset;
        updateTrackName();
      }

      function nextTrack() {
        currentTrack = (currentTrack + 1) % TRACKS.length;
        playTrack(currentTrack, 0);
      }

      function prevTrack() {
        currentTrack = (currentTrack - 1 + TRACKS.length) % TRACKS.length;
        playTrack(currentTrack, 0);
      }

      function toggleAudioPlay() {
        if (!audioReady) return;
        if (!isPlaying) {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          playTrack(currentTrack, trackOffset);
          isPlaying = true;
          document.getElementById('btn-playpause').textContent = '⏸';
          document.getElementById('btn-play').textContent = '⏸ Pause';
        } else {
          // Pause: record offset
          trackOffset += audioCtx.currentTime - playStartAt;
          if (sourceA) { try { sourceA.stop(); } catch(e){} }
          if (sourceB) { try { sourceB.stop(); } catch(e){} }
          isPlaying = false;
          document.getElementById('btn-playpause').textContent = '▶';
          document.getElementById('btn-play').textContent = '▶ Play';
        }
      }

      function updateTrackName() {
        const el = document.getElementById('track-name');
        if (el) el.textContent = TRACKS[currentTrack]?.name ?? '—';
      }

      // ═══════════════════════════════════════
      //  VISUALISER BARS
      // ═══════════════════════════════════════
      const visContainer = document.getElementById('visualiser');
      const VIS_BARS = 18;
      const visBars = [];
      for (let i = 0; i < VIS_BARS; i++) {
        const b = document.createElement('div');
        b.className = 'vis-bar';
        visContainer.appendChild(b);
        visBars.push(b);
      }

      const freqData = new Uint8Array(128);

      function updateVisualiser() {
        if (!analyser || !isPlaying) {
          visBars.forEach(b => b.style.height = '2px');
          return;
        }
        analyser.getByteFrequencyData(freqData);
        const step = Math.floor(freqData.length / VIS_BARS);
        for (let i = 0; i < VIS_BARS; i++) {
          const v = freqData[i * step] / 255;
          visBars[i].style.height = `${2 + v * 22}px`;
        }

        // Audio reactivity: bass avg (first ~8 bins)
        if (audioReact) {
          let bass = 0;
          for (let i = 0; i < 8; i++) bass += freqData[i];
          bass /= (8 * 255);
          uniforms.uAudioBass.value = bass;
        } else {
          uniforms.uAudioBass.value *= 0.9; // decay to 0
        }
      }

      // ═══════════════════════════════════════
      //  PROGRESS BAR
      // ═══════════════════════════════════════
      const progressEl = document.getElementById('progress-bar');
      const timeEl     = document.getElementById('track-time');
      let seekDragging = false;

      progressEl.addEventListener('mousedown', () => seekDragging = true);
      progressEl.addEventListener('mouseup', () => {
        if (!audioReady) return;
        seekDragging = false;
        const dur = buffers[currentTrack]?.duration || 1;
        const offset = parseFloat(progressEl.value) * dur;
        if (isPlaying) { playTrack(currentTrack, offset); }
        else { trackOffset = offset; }
      });

      function updateProgress() {
        if (!buffers[currentTrack]) return;
        const dur = buffers[currentTrack].duration;
        const current = isPlaying
          ? Math.min(audioCtx.currentTime - playStartAt, dur)
          : trackOffset;
        if (!seekDragging) progressEl.value = current / dur;
        timeEl.textContent = `${fmt(current)} / ${fmt(dur)}`;
      }

      // ═══════════════════════════════════════
      //  UI CONTROLS
      // ═══════════════════════════════════════

      // Helper to bind slider
      function bindSlider(id, lblId, onChange) {
        const el  = document.getElementById(id);
        const lbl = document.getElementById(lblId);
        function update() {
          const v = parseFloat(el.value);
          lbl.textContent = v.toFixed(el.step.includes('.') && el.step !== '1' ? (el.step.split('.')[1].length) : 0);
          onChange(v);
        }
        el.addEventListener('input', update);
        update();
      }

      bindSlider('noise-scale', 'lbl-noise', v => uniforms.uNoiseScale.value = v);
      bindSlider('anim-speed',  'lbl-speed',  v => uniforms.uSpeed.value = v);
      bindSlider('point-size',  'lbl-pts',    v => uniforms.uPointSize.value = v);
      bindSlider('bloom-int',   'lbl-bloom',  v => bloomPass.strength = v);
      bindSlider('bloom-rad',   'lbl-bloom-r',v => bloomPass.radius   = v);

      document.getElementById('color1').addEventListener('input', e => {
        uniforms.uColor1.value = hexToVec3(e.target.value);
      });
      document.getElementById('color2').addEventListener('input', e => {
        uniforms.uColor2.value = hexToVec3(e.target.value);
      });

      document.getElementById('btn-play').addEventListener('click', () => {
        const btn = document.getElementById('btn-play');
        if (!isPlaying) {
          btn.textContent = '⏸ Pause';
          btn.classList.add('active');
          toggleAudioPlay();
        } else {
          btn.textContent = '▶ Play';
          btn.classList.remove('active');
          toggleAudioPlay();
        }
      });

      document.getElementById('btn-react').addEventListener('click', () => {
        audioReact = !audioReact;
        document.getElementById('btn-react').classList.toggle('active', audioReact);
      });

      document.getElementById('btn-screenshot').addEventListener('click', () => {
        composer.render();
        renderer.domElement.toBlob(blob => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `point_cloud_${Date.now()}.png`;
          a.click();
        });
      });

      // audio strip controls
      document.getElementById('btn-playpause').addEventListener('click', toggleAudioPlay);
      document.getElementById('btn-next').addEventListener('click', nextTrack);
      document.getElementById('btn-prev').addEventListener('click', prevTrack);
      document.getElementById('volume-slider').addEventListener('input', e => {
        volValue = parseFloat(e.target.value);
        updateVolume(volValue);
      });

      // ═══════════════════════════════════════
      //  START OVERLAY
      // ═══════════════════════════════════════
      document.getElementById('start-btn').addEventListener('click', async () => {
        document.getElementById('start-overlay').style.display = 'none';
        await initAudio();
        isPlaying = true;
        playTrack(0, 0);
        document.getElementById('btn-playpause').textContent = '⏸';
        document.getElementById('btn-play').textContent = '⏸ Pause';
        document.getElementById('btn-play').classList.add('active');
      });

      // ═══════════════════════════════════════
      //  RENDER LOOP
      // ═══════════════════════════════════════
      const clock = new THREE.Clock();
      let animPaused = false;

      // Ctrl+Space to pause animation (extra shortcut)
      window.addEventListener('keydown', e => {
        if (e.code === 'Space' && e.ctrlKey) { e.preventDefault(); toggleAudioPlay(); }
      });

      (function loop() {
        requestAnimationFrame(loop);
        uniforms.uTime.value = clock.getElapsedTime();
        controls.update();
        updateVisualiser();
        if (audioReady && isPlaying) updateProgress();
        composer.render();
      })();
    </script>
  </body>
</html>
